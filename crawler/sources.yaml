  # ---- link-list aggregators (titles only; last dates come from each detail page, cached in data/jd.json)
  - {name: "SarkariResult – Latest Jobs", url: "https://www.sarkariresult.com/latestjob/", parser: links}
  - {name: "SarkariExam – Online Forms", url: "https://www.sarkariexam.com/category/top-online-form/", parser: links}
  - {name: "Sarkari Naukri Blog", url: "https://www.sarkarinaukriblog.com/", parser: links, include: "/20\\d\\d/"}
  - {name: "FreshersNow – Govt Jobs", url: "https://www.freshersnow.com/government-jobs/", parser: links}
  - {name: "Adda247 – Govt Jobs", url: "https://www.adda247.com/jobs/", parser: links, include: "/jobs/"}
  - {name: "Testbook – Govt Jobs", url: "https://testbook.com/govt-jobs", parser: links}
  - {name: "Jagran Josh – Govt Jobs", url: "https://www.jagranjosh.com/government-jobs", parser: links}
  - {name: "Freshersworld – Govt Jobs", url: "https://www.freshersworld.com/government-jobs", parser: links}
  # JavaScript-rendered portals: plain HTML fetch returns no listings. Kept here, switched off,
  # until an API/RSS or headless-browser fetch is added.
  - {name: "Naukri – Govt Jobs", url: "https://www.naukri.com/government-jobs", parser: links, enabled: false}
  - {name: "Employment News", url: "https://www.employmentnews.gov.in/NewEmp/Home.aspx", parser: links, enabled: false}
  - {name: "National Career Service", url: "https://www.ncs.gov.in/", parser: links, enabled: false}

