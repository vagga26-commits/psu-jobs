# Sources the crawler visits. Two kinds:
#   aggregator – tabular listing pages (FreeJobAlert-style). Parsed by header names.
#   official   – a PSU's own careers page. Parsed with a keyword heuristic that
#                harvests recruitment/advertisement links and any dates near them.
# Add a source by appending an entry; no code change needed for either kind.

aggregators:
  # category = department hint used when the organisation name doesn't decide it
  # state    = location for every row on that page (state pages)
  - {name: "FreeJobAlert – PSU",      url: "https://www.freejobalert.com/psu-jobs/",            parser: table, category: PSU}
  - {name: "FreeJobAlert – Bank",     url: "https://www.freejobalert.com/bank-jobs/",           parser: table, category: "Banking & Finance", only_known_orgs: true}
  - {name: "FreeJobAlert – Govt Jobs", url: "https://www.freejobalert.com/government-jobs/",    parser: table, category: "Central Govt"}
  - {name: "FreeJobAlert – Latest",   url: "https://www.freejobalert.com/latest-notifications/", parser: table}
  - {name: "FreeJobAlert – Railway",  url: "https://www.freejobalert.com/railway-jobs/",        parser: table, category: Railway}
  - {name: "FreeJobAlert – Defence",  url: "https://www.freejobalert.com/police-defence-jobs/", parser: table, category: "Defence & Police"}
  - {name: "FreeJobAlert – Teaching", url: "https://www.freejobalert.com/teaching-faculty-jobs/", parser: table, category: "Teaching & Research"}
  # state pages (slugs follow FreeJobAlert's pattern; a 404 is logged and skipped)
  - {name: "FreeJobAlert – Uttar Pradesh", url: "https://www.freejobalert.com/up-government-jobs/", parser: table, category: "State Govt", state: "Uttar Pradesh"}
  - {name: "FreeJobAlert – Rajasthan", url: "https://www.freejobalert.com/rajasthan-government-jobs/", parser: table, category: "State Govt", state: "Rajasthan"}
  - {name: "FreeJobAlert – Maharashtra", url: "https://www.freejobalert.com/maharashtra-government-jobs/", parser: table, category: "State Govt", state: "Maharashtra"}
  - {name: "FreeJobAlert – Karnataka", url: "https://www.freejobalert.com/karnataka-government-jobs/", parser: table, category: "State Govt", state: "Karnataka"}
  - {name: "FreeJobAlert – Madhya Pradesh", url: "https://www.freejobalert.com/mp-government-jobs/", parser: table, category: "State Govt", state: "Madhya Pradesh"}
  - {name: "FreeJobAlert – Tamil Nadu", url: "https://www.freejobalert.com/tn-government-jobs/", parser: table, category: "State Govt", state: "Tamil Nadu"}
  - {name: "FreeJobAlert – West Bengal", url: "https://www.freejobalert.com/wb-government-jobs/", parser: table, category: "State Govt", state: "West Bengal"}
  - {name: "FreeJobAlert – Gujarat", url: "https://www.freejobalert.com/gujarat-government-jobs/", parser: table, category: "State Govt", state: "Gujarat"}
  - {name: "FreeJobAlert – Telangana", url: "https://www.freejobalert.com/telangana-government-jobs/", parser: table, category: "State Govt", state: "Telangana"}
  - {name: "FreeJobAlert – Kerala", url: "https://www.freejobalert.com/kerala-government-jobs/", parser: table, category: "State Govt", state: "Kerala"}
  - {name: "FreeJobAlert – Haryana", url: "https://www.freejobalert.com/haryana-government-jobs/", parser: table, category: "State Govt", state: "Haryana"}
  - {name: "FreeJobAlert – Bihar", url: "https://www.freejobalert.com/bihar-government-jobs/", parser: table, category: "State Govt", state: "Bihar"}
  - {name: "FreeJobAlert – Andhra Pradesh", url: "https://www.freejobalert.com/ap-government-jobs/", parser: table, category: "State Govt", state: "Andhra Pradesh"}
  - {name: "FreeJobAlert – Odisha", url: "https://www.freejobalert.com/odisha-government-jobs/", parser: table, category: "State Govt", state: "Odisha"}
  - {name: "FreeJobAlert – Punjab", url: "https://www.freejobalert.com/punjab-government-jobs/", parser: table, category: "State Govt", state: "Punjab"}
  - {name: "FreeJobAlert – Delhi", url: "https://www.freejobalert.com/delhi-government-jobs/", parser: table, category: "State Govt", state: "Delhi"}
  - {name: "FreeJobAlert – Assam", url: "https://www.freejobalert.com/assam-government-jobs/", parser: table, category: "State Govt", state: "Assam"}
  - {name: "FreeJobAlert – Jharkhand", url: "https://www.freejobalert.com/jharkhand-government-jobs/", parser: table, category: "State Govt", state: "Jharkhand"}
  - {name: "FreeJobAlert – Uttarakhand", url: "https://www.freejobalert.com/uttarakhand-government-jobs/", parser: table, category: "State Govt", state: "Uttarakhand"}
  - {name: "FreeJobAlert – Himachal Pradesh", url: "https://www.freejobalert.com/hp-government-jobs/", parser: table, category: "State Govt", state: "Himachal Pradesh"}
  - {name: "FreeJobAlert – Chhattisgarh", url: "https://www.freejobalert.com/chhattisgarh-government-jobs/", parser: table, category: "State Govt", state: "Chhattisgarh"}
